<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 790" width="1280" height="790" font-family="'DejaVu Sans', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3C7A3C"/></marker>
    <style>
      .ff  { fill:#DCEBFA; stroke:#2B5C8A; stroke-width:2; }
      .cm  { fill:#FDE8CC; stroke:#B26A00; stroke-width:2; }
      .ct  { fill:#E4F3E1; stroke:#3C7A3C; stroke-width:2; }
      .w   { stroke:#222; stroke-width:2.2; fill:none; marker-end:url(#a); }
      .wd  { stroke:#3C7A3C; stroke-width:1.8; stroke-dasharray:6 4; fill:none; marker-end:url(#ad); }
      .wn  { stroke:#3C7A3C; stroke-width:1.8; stroke-dasharray:6 4; fill:none; }
      .b   { font-size:14px; font-weight:bold; fill:#111; }
      .t   { font-size:12px; fill:#111; }
      .s   { font-size:11px; fill:#444; }
      .g   { font-size:11px; fill:#2d6a2d; }
    </style>
  </defs>
  <rect width="1280" height="790" fill="#ffffff"/>
  <text x="20" y="26" class="b" style="font-size:16px">G01 · Sơ đồ khối (khớp RTL g01_moving_average4)</text>

  <!-- valid_in bus (control) -->
  <text x="20" y="66" class="b">valid_in</text>
  <path d="M95 62 H930" class="wn"/>
  <path d="M340 62 V100" class="wd"/>
  <path d="M660 62 V100" class="wd"/>
  <path d="M930 62 V150" class="wd"/>
  <circle cx="340" cy="62" r="3.5" fill="#3C7A3C"/><circle cx="660" cy="62" r="3.5" fill="#3C7A3C"/>

  <!-- wr_ptr -->
  <rect x="300" y="100" width="170" height="70" rx="6" class="ff"/>
  <text x="385" y="128" text-anchor="middle" class="b">wr_ptr[1:0]</text>
  <text x="385" y="148" text-anchor="middle" class="s">2 FF · +1 mỗi mẫu hợp lệ</text>
  <text x="385" y="162" text-anchor="middle" class="s">(cuộn 3 → 0)</text>

  <!-- count_q -->
  <rect x="540" y="100" width="240" height="100" rx="6" class="ff"/>
  <text x="660" y="124" text-anchor="middle" class="b">count_q[2:0]  (3 FF)</text>
  <text x="660" y="144" text-anchor="middle" class="s">đếm mẫu, bão hoà tại 4 (0…4)</text>
  <text x="660" y="168" text-anchor="middle" class="t">fill  = (count_q &lt; 4)</text>
  <text x="660" y="188" text-anchor="middle" class="t">ready = (count_q ≥ 3)</text>

  <!-- AND + valid_out -->
  <rect x="900" y="150" width="60" height="40" rx="6" class="ct"/>
  <text x="930" y="175" text-anchor="middle" class="b">AND</text>
  <path d="M780 170 H900" class="wd"/>
  <text x="790" y="162" class="g">ready</text>
  <rect x="1020" y="140" width="140" height="60" rx="6" class="ff"/>
  <text x="1090" y="166" text-anchor="middle" class="b">valid_out</text>
  <text x="1090" y="184" text-anchor="middle" class="s">1 FF · xung 1 chu kỳ</text>
  <path d="M960 170 H1020" class="w"/>
  <path d="M1160 170 H1240" class="w"/>
  <text x="1165" y="162" class="b">valid_out</text>

  <!-- enable to avg_out -->
  <path d="M930 190 V250 H1090 V330" class="wd"/>
  <text x="1000" y="243" class="g">en_avg = valid_in ∧ ready</text>

  <!-- fill to ALU -->
  <path d="M660 200 V310" class="wd"/>
  <text x="670" y="248" class="g">fill → bỏ phép trừ</text>

  <!-- sample_in -->
  <text x="20" y="345" class="b">sample_in[7:0]</text>
  <path d="M140 340 H375 a10 10 0 0 1 20 0 H540" class="w"/>
  <circle cx="230" cy="340" r="3.5" fill="#222"/>
  <path d="M230 340 V420 H300" class="w"/>
  <text x="408" y="332" class="s">x (mở rộng 10 bit)</text>

  <!-- wr_ptr to mem -->
  <path d="M385 170 V390" class="w"/>
  <text x="395" y="250" class="s">địa chỉ: ghi &amp; đọc</text>
  <text x="395" y="264" class="s">cùng wr_ptr</text>

  <!-- sample_mem -->
  <rect x="300" y="390" width="170" height="130" rx="6" class="ff"/>
  <text x="385" y="416" text-anchor="middle" class="b">sample_mem[0:3]</text>
  <text x="385" y="436" text-anchor="middle" class="s">4 × 8 bit = 32 FF</text>
  <text x="385" y="462" text-anchor="middle" class="s">ghi: mem[wr_ptr] ← x</text>
  <text x="385" y="480" text-anchor="middle" class="s">đọc: oldest = mem[wr_ptr]</text>
  <text x="385" y="498" text-anchor="middle" class="s">(đọc trước khi bị ghi đè)</text>
  <path d="M470 430 H540" class="w"/>
  <text x="474" y="423" class="s">oldest</text>

  <!-- ALU -->
  <rect x="540" y="310" width="240" height="140" rx="6" class="cm"/>
  <text x="660" y="336" text-anchor="middle" class="b">ALU · tổ hợp · 10 bit</text>
  <text x="660" y="364" text-anchor="middle" class="t">sum_next = fill ?</text>
  <text x="660" y="382" text-anchor="middle" class="t">  sum_q + x</text>
  <text x="660" y="400" text-anchor="middle" class="t">: sum_q + x − oldest</text>
  <text x="660" y="428" text-anchor="middle" class="s">(đường tới hạn dự đoán: cộng/trừ 10 bit)</text>

  <!-- sum_q -->
  <rect x="540" y="550" width="240" height="70" rx="6" class="ff"/>
  <text x="660" y="580" text-anchor="middle" class="b">sum_q[9:0]  (10 FF)</text>
  <text x="660" y="600" text-anchor="middle" class="s">tổng 4 mẫu ≤ 4 × 255 = 1020 &lt; 1024</text>
  <path d="M700 450 V550" class="w"/>
  <path d="M620 550 V450" class="w"/>
  <text x="612" y="505" text-anchor="end" class="s">sum_q</text>
  <text x="708" y="505" class="s">sum_next[9:0]</text>
  <circle cx="700" cy="520" r="3.5" fill="#222"/>

  <!-- tap to avg_out -->
  <path d="M700 520 H1090 V400" class="w"/>
  <text x="820" y="512" class="s">sum_next[9:2]  (&gt;&gt; 2 chỉ là đổi dây, 0 cell)</text>

  <!-- avg_out -->
  <rect x="1020" y="330" width="140" height="70" rx="6" class="ff"/>
  <text x="1090" y="360" text-anchor="middle" class="b">avg_out[7:0]</text>
  <text x="1090" y="380" text-anchor="middle" class="s">8 FF</text>
  <path d="M1160 365 H1240" class="w"/>
  <text x="1165" y="357" class="b">avg_out</text>

  <!-- legend -->
  <rect x="20" y="650" width="22" height="14" class="ff"/><text x="48" y="662" class="s">phần tử nhớ (FF)</text>
  <rect x="190" y="650" width="22" height="14" class="cm"/><text x="218" y="662" class="s">logic tổ hợp</text>
  <rect x="320" y="650" width="22" height="14" class="ct"/><text x="348" y="662" class="s">điều khiển</text>
  <path d="M450 657 H490" class="wd"/><text x="498" y="662" class="s">tín hiệu điều khiển / enable</text>

  <!-- notes -->
  <text x="20" y="700" class="t">• clk, rst_n → mọi FF. rst_n = 0 (đồng bộ, mức thấp) xoá: sample_mem, wr_ptr, count_q, sum_q, avg_out, valid_out.</text>
  <text x="20" y="722" class="t">• sample_mem, wr_ptr, count_q, sum_q, avg_out chỉ cập nhật khi valid_in = 1; valid_out mặc định về 0 mỗi chu kỳ (xung 1 chu kỳ).</text>
  <text x="20" y="744" class="t">• avg_out ← sum_next[9:2] (không lấy từ sum_q) nên độ trễ từ mẫu vào đến kết quả ra là 1 chu kỳ clock.</text>
  <text x="20" y="766" class="t">• Số FF theo cấu trúc: 32 + 2 + 3 + 10 + 8 + 1 = 56 (đếm tay trước synthesis; sẽ đối chiếu số đo ở M3).</text>
</svg>
